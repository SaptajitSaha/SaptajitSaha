<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Saptajit Saha — Data Scientist / ML Engineer in the making</title>
  <desc id="desc">Animated scramble-to-resolve GitHub profile banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="50%" stop-color="#ff8833"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="180" rx="8"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
