    <path d="M0 0H1200V132C1050 155 930 146 800 137C650 126 535 144 400 151C255 159 130 147 0 126Z" fill="#ffffff" opacity=".06"/>
    <path d="M0 0H1200V150C1050 164 920 153 780 145C635 137 520 153 385 160C240 168 120 158 0 139Z" fill="#ffffff" opacity=".05"/>

