      <text x="600" y="72">X@P7AJ!T S4H@<animate attributeName="opacity" values="1;0" keyTimes="0;.08" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="600" y="72" opacity="0">S#P7@JIT S@H4<animate attributeName="opacity" values="0;1;0" keyTimes="0;.08;.16" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="600" y="72" opacity="0">SAPT@J!T S4HA<animate attributeName="opacity" values="0;1;0" keyTimes="0;.16;.24" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="600" y="72" opacity="0">Sapt@jit Saha<animate attributeName="opacity" values="0;1;0" keyTimes="0;.24;.32" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="600" y="72" opacity="0">Saptaj!t Saha<animate attributeName="opacity" values="0;1;0" keyTimes="0;.32;.40" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="600" y="72" opacity="0">Saptajit Saha<animate attributeName="opacity" values="0;1" keyTimes="0;.40" dur="4.5s" repeatCount="indefinite"/></text>
    </g>

