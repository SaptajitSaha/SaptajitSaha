      <text x="600" y="104" opacity="0">D@t@ 5c!3nt!5t / ML 3ng!n33r !n th3 m@k!ng<animate attributeName="opacity" values="0;1;0" keyTimes="0;.05;.15" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="600" y="104" opacity="0">D4t4 Sc!3nt!st / ML 3ng!n33r in th3 m@k!ng<animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;.25" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="600" y="104" opacity="0">Data Sc!entist / ML Eng!neer in the making<animate attributeName="opacity" values="0;1;0" keyTimes="0;.25;.35" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="600" y="104" opacity="0">Data Scientist / ML 3ngineer in the making<animate attributeName="opacity" values="0;1;0" keyTimes="0;.35;.45" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="600" y="104" opacity="0">Data Scientist / ML Engineer in the making<animate attributeName="opacity" values="0;1;1" keyTimes="0;.45;1" dur="4.5s" repeatCount="indefinite"/></text>
