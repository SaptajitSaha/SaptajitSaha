name: Repair broken tech stack icons

on:
  push:
    paths:
      - '.github/workflows/fix-broken-tech-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace only broken icons
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')

          old_data = '  <img src="https://cdn.simpleicons.org/pandas/150458" height="50" alt="Pandas" />\n  <img src="https://cdn.simpleicons.org/numpy/013243" height="50" alt="NumPy" />\n  <img src="https://cdn.simpleicons.org/matplotlib/11557C" height="50" alt="Matplotlib" />\n  <img src="https://cdn.simpleicons.org/seaborn/43A19A" height="50" alt="Seaborn" />\n  <img src="https://cdn.simpleicons.org/powerbi/F2C811" height="50" alt="Power BI" />\n  <img src="https://cdn.simpleicons.org/tableau/E97627" height="50" alt="Tableau" />\n  <img src="https://cdn.simpleicons.org/looker/4285F4" height="50" alt="Looker Studio" />\n  <img src="https://cdn.simpleicons.org/microsoftexcel/217346" height="50" alt="Excel" />\n  <img src="https://cdn.simpleicons.org/googlesheets/34A853" height="50" alt="Google Sheets" />'
          new_data = '''  <img src="https://cdn.simpleicons.org/pandas/150458" height="50" alt="Pandas" />
          <img src="https://cdn.simpleicons.org/numpy/013243" height="50" alt="NumPy" />
          <img src="https://api.iconify.design/logos:matplotlib.svg" height="50" alt="Matplotlib" />
          <img src="https://api.iconify.design/logos:seaborn-icon.svg" height="50" alt="Seaborn" />
          <img src="https://api.iconify.design/logos:microsoft-power-bi.svg" height="50" alt="Power BI" />
          <img src="https://api.iconify.design/logos:tableau.svg" height="50" alt="Tableau" />
          <img src="https://cdn.simpleicons.org/looker/4285F4" height="50" alt="Looker Studio" />
          <img src="https://api.iconify.design/vscode-icons:file-type-excel.svg" height="50" alt="Excel" />
          <img src="https://cdn.simpleicons.org/googlesheets/34A853" height="50" alt="Google Sheets" />'''

          old_tools = '  <img src="https://cdn.simpleicons.org/git/F05032" height="50" alt="Git" />\n  <img src="https://cdn.simpleicons.org/github/FFFFFF" height="50" alt="GitHub" />\n  <img src="https://cdn.simpleicons.org/visualstudiocode/007ACC" height="50" alt="VS Code" />\n  <img src="https://cdn.simpleicons.org/jupyter/F37626" height="50" alt="Jupyter" />\n  <img src="https://cdn.simpleicons.org/googlecloud/4285F4" height="50" alt="Google Cloud" />'
          new_tools = '''  <img src="https://cdn.simpleicons.org/git/F05032" height="50" alt="Git" />
          <img src="https://cdn.simpleicons.org/github/FFFFFF" height="50" alt="GitHub" />
          <img src="https://api.iconify.design/logos:visual-studio-code.svg" height="50" alt="VS Code" />
          <img src="https://cdn.simpleicons.org/jupyter/F37626" height="50" alt="Jupyter" />
          <img src="https://cdn.simpleicons.org/googlecloud/4285F4" height="50" alt="Google Cloud" />'''

          if old_data in s:
              s = s.replace(old_data, new_data, 1)
          if old_tools in s:
              s = s.replace(old_tools, new_tools, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "fix: replace only broken tech stack icons"
          git push

# Stable icon-source repair; working icons are intentionally left unchanged.
