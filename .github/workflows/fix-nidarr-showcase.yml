name: Fix Nidarr showcase

on:
  push:
    paths:
      - 'assets/nidarr-showcase.svg'
      - '.github/workflows/fix-nidarr-showcase.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch README showcase asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/nidarr-showcase.jpg', 'assets/nidarr-showcase.svg')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit README change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "fix: use reliable Nidarr showcase SVG"
          git push
