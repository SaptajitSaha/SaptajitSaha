name: Generate Focus Bars GIF

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-focus-gif.yml'
      - 'assets/focus-bars.svg'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Generate animated GIF
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter, ImageFont
          from pathlib import Path

          W, H = 760, 190
          frames = 48
          out = Path('assets/focus-bars.gif')
          out.parent.mkdir(parents=True, exist_ok=True)

          labels = [('DATA SCIENCE', 295), ('AI / ML', 262), ('QUANT FINANCE', 197), ('OPEN SOURCE', 197)]
          y_positions = [23, 63, 103, 143]
          x0, track_w, bar_h = 190, 360, 18

          # Three closely related orange tones for a restrained, cohesive effect.
          stops = [
              (0.00, (224, 75, 10)),
              (0.50, (255, 107, 0)),
              (1.00, (255, 179, 71)),
          ]

          def interp(a, b, t):
              return tuple(int(a[i] + (b[i] - a[i]) * t) for i in range(3))

          def warm_orange(t):
              t %= 1.0
              if t <= 0.5:
                  return interp(stops[0][1], stops[1][1], t / 0.5)
              return interp(stops[1][1], stops[2][1], (t - 0.5) / 0.5)

          def gradient(width, height, phase):
              img = Image.new('RGBA', (width, height), (0, 0, 0, 0))
              px = img.load()
              for x in range(width):
                  t = (x / max(1, width - 1) + phase) % 1.0
                  c = warm_orange(t)
                  for y in range(height):
                      edge = abs((y / max(1, height - 1)) - 0.5) * 2
                      v = 0.84 + 0.16 * (1 - edge)
                      px[x, y] = tuple(int(v * q) for q in c) + (255,)
              mask = Image.new('L', (width, height), 0)
              ImageDraw.Draw(mask).rounded_rectangle((0, 0, width - 1, height - 1), radius=6, fill=255)
              img.putalpha(mask)
              return img

          try:
              font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf', 15)
          except OSError:
              font = ImageFont.load_default()

          result = []
          for f in range(frames):
              base = Image.new('RGBA', (W, H), (13, 13, 13, 255))
              d = ImageDraw.Draw(base)
              d.rounded_rectangle((1, 1, W - 2, H - 2), radius=13, outline=(38, 38, 38, 255), width=1)

              for idx, ((text, width), y) in enumerate(zip(labels, y_positions)):
                  d.text((24, y + 1), text, fill=(245, 245, 245, 255), font=font)
                  d.rounded_rectangle((x0, y, x0 + track_w, y + bar_h), radius=6, fill=(23, 23, 23, 255), outline=(43, 43, 43, 255))

                  phase = (f / frames) * (1.0 if idx % 2 == 0 else -1.0) + idx * 0.11
                  grad = gradient(width, bar_h, phase)

                  layer = Image.new('RGBA', (W, H), (0, 0, 0, 0))
                  layer.alpha_composite(grad, (x0, y))
                  base.alpha_composite(layer.filter(ImageFilter.GaussianBlur(5)))
                  base.alpha_composite(layer)

                  highlight = Image.new('RGBA', (width, bar_h), (0, 0, 0, 0))
                  hd = ImageDraw.Draw(highlight)
                  hd.rounded_rectangle((2, 2, width - 3, 5), radius=2, fill=(255, 247, 238, 58))
                  base.alpha_composite(highlight, (x0, y))

              result.append(base.convert('P', palette=Image.Palette.ADAPTIVE))

          result[0].save(out, save_all=True, append_images=result[1:], duration=75, loop=0, optimize=False, disposal=2)
          PY

      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/focus-bars.gif
          git diff --cached --quiet || git commit -m "chore: refresh warm orange focus bars"
          git push
