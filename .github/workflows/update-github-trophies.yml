name: Update GitHub Trophies

on:
  push:
    paths-ignore:
      - "assets/github-trophies.svg"
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 0"

permissions:
  contents: write

jobs:
  generate-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=SaptajitSaha&theme=onedark&no-bg=true&column=6&margin-w=10&margin-h=10'
          path: assets/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-trophies.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub trophies"
          git push
