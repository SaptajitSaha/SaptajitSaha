name: Update GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 0"

permissions:
  contents: write

jobs:
  generate-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: SaptajitSaha
          output_path: assets/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: onedark

      - name: Commit updated trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-trophies.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub trophies"
          git push
