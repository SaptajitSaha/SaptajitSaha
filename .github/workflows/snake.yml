name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SaptajitSaha
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snake to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp dist/github-contribution-grid-snake.svg /tmp/github-contribution-grid-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg /tmp/github-contribution-grid-snake-dark.svg

          git fetch origin output
          git checkout output

          cp /tmp/github-contribution-grid-snake.svg .
          cp /tmp/github-contribution-grid-snake-dark.svg .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Snake is already up to date."
          else
            git commit -m "chore: update contribution snake"
            git push "https://x-access-token:$GITHUB_TOKEN@github.com/SaptajitSaha/SaptajitSaha.git" output
          fi
